# Configuration semantics, each against a self-contained project.
name: config

# Every case starts from these two documents, then adds the configuration
# it needs. Each one runs in a scratch directory built from just these.
files:
  test.md: |
    This is a very important sentence. There is a sentence here too. javascript agendize
  test.py: |
    # There is always something to say. Very good! (e.g., this is good)
    # The centre issue is that everything is going to the center.

cases:
  - name: level-warning
    files:
      .vale: |
        StylesPath = ../../styles/
        MinAlertLevel = warning

        [*]
        BasedOnStyles = vale
    args: test.md
    exit: 0
    want: |
      test.md:1:11:vale.Editorializing:Consider removing 'very'

  - name: no-styles-path-builtin
    files:
      .vale: |
        MinAlertLevel = suggestion

        [*]
        BasedOnStyles = Vale
    args: test.md
    exit: 1
    want: |
      test.md:1:66:Vale.Spelling:Use 'JavaScript' instead of 'javascript'.
      test.md:1:77:Vale.Spelling:Did you really mean 'agendize'?

  - name: no-styles-path-external
    files:
      .vale: |
        MinAlertLevel = suggestion

        [*]
        BasedOnStyles = Vale, proselint
    args: test.md
    exit: 2
    contains: |
      Style 'proselint' isn't on the StylesPath

  - name: unknown-style-points-at-config
    about: "an unknown style is reported at the BasedOnStyles line that names
      it, not at a comment that mentions it"
    files:
      .vale.ini: |
        StylesPath = styles

        # Nope is only mentioned here.
        [*.md]
        BasedOnStyles = Vale, Nope
      styles/config/vocabularies/Base/accept.txt: |
        Vale
    args: --output=line test.md
    exit: 2
    contains: |
      .vale.ini:5:E201:Style 'Nope' isn't on the StylesPath

  - name: missing-styles-path
    about: "the StylesPath line is found by the value as written, so the error
      shows it instead of line 0 and the whole file"
    files:
      .vale.ini: |
        # Where styles live.
        StylesPath = nowhere

        [*.md]
        BasedOnStyles = Vale
    args: --output=line test.md
    exit: 2
    contains: |
      .vale.ini:2:E201:The StylesPath

  - name: bad-pattern-points-at-token
    about: "a pattern that doesn't compile is reported at its own line, quoted
      as written rather than inside the pattern Vale builds around it"
    files:
      .vale.ini: |
        StylesPath = styles

        [*.md]
        BasedOnStyles = T
      styles/T/Bad.yml: |
        extends: existence
        message: "'%s'"
        tokens:
          - fine
          - '(unclosed'
    args: --output=line test.md
    exit: 2
    contains: |
      styles/T/Bad.yml:5:E201:Invalid pattern: missing closing ) in `(unclosed`

  - name: invalid-level-warns
    about: "a bad level and a misspelled key used to be ignored in silence"
    files:
      .vale.ini: |
        [*.md]
        BasedOnStyle = Vale
        Vale.Spelling = maybe
    args: --no-color test.md
    exit: 0
    contains: |
      W101 'BasedOnStyle' isn't a section option; Vale is ignoring it.
      W101 'Vale.Spelling = maybe' isn't YES, NO, UNSET, or a level; Vale is switching the rule off.

  - name: level-error
    files:
      .vale: |
        MinAlertLevel = error

        [*]
        BasedOnStyles = Vale

        Vale.Spelling = NO
    args: test.md
    exit: 0
    want: ""

  - name: styles-format-mismatch
    files:
      .vale: |
        StylesPath = ../../styles/
        MinAlertLevel = warning

        [*.py]
        BasedOnStyles = vale

        vale.Spelling = NO
    args: test.md
    exit: 0
    want: ""

  - name: styles-per-syntax
    files:
      .vale: |
        StylesPath = ../../styles/
        MinAlertLevel = warning

        [*.md]
        BasedOnStyles = vale

        vale.Spelling = NO

        [*.py]
        BasedOnStyles = write-good
        write-good.E-Prime = NO
    args: .
    exit: 1
    want: |
      test.md:1:11:vale.Editorializing:Consider removing 'very'
      test.py:1:3:write-good.ThereIs:Don't start a sentence with 'There is'
      test.py:1:37:write-good.Weasel:'Very' is a weasel word!

  - name: checks-per-syntax
    files:
      _vale: |
        StylesPath = ../../styles/
        MinAlertLevel = warning

        [*.md]
        BasedOnStyles = vale

        vale.Spelling = NO

        [*.py]
        BasedOnStyles = write-good
        write-good.E-Prime = NO
        write-good.Weasel = NO
    args: .
    exit: 1
    want: |
      test.md:1:11:vale.Editorializing:Consider removing 'very'
      test.py:1:3:write-good.ThereIs:Don't start a sentence with 'There is'

  - name: styles-per-syntax-override
    files:
      _vale: |
        StylesPath = ../../styles/
        MinAlertLevel = warning

        [*]
        BasedOnStyles = vale

        vale.Spelling = NO

        [*.py]
        BasedOnStyles = write-good
        write-good.E-Prime = NO
    args: test.py
    exit: 1
    want: |
      test.py:1:3:write-good.ThereIs:Don't start a sentence with 'There is'
      test.py:1:37:write-good.Weasel:'Very' is a weasel word!

  - name: rules-per-syntax-override
    files:
      _vale: |
        StylesPath = ../../styles/
        MinAlertLevel = warning

        [*]
        BasedOnStyles = write-good
        write-good.Weasel = NO

        [*.py]
        write-good.Weasel = YES
    args: test.py test.md
    exit: 1
    want: |
      test.py:1:3:write-good.ThereIs:Don't start a sentence with 'There is'
      test.py:1:37:write-good.Weasel:'Very' is a weasel word!

  - name: rules-per-file-override
    files:
      _vale: |
        StylesPath = ../../styles/
        MinAlertLevel = warning

        [*]
        BasedOnStyles = write-good
        write-good.Weasel = NO

        [test.py]
        write-good.Weasel = YES
    args: test.py test.md
    exit: 1
    want: |
      test.py:1:3:write-good.ThereIs:Don't start a sentence with 'There is'
      test.py:1:37:write-good.Weasel:'Very' is a weasel word!

  - name: two-base-styles
    files:
      _vale: |
        StylesPath = ../../styles/
        MinAlertLevel = warning

        [*]
        BasedOnStyles = Joblint, write-good
        write-good.E-Prime = NO
    args: test.py test.md
    exit: 1
    want: |
      test.md:1:11:write-good.Weasel:'very' is a weasel word!
      test.md:1:66:Joblint.TechTerms:Use 'JavaScript' instead of 'javascript'
      test.py:1:3:write-good.ThereIs:Don't start a sentence with 'There is'
      test.py:1:37:write-good.Weasel:'Very' is a weasel word!

  - name: individual-rules
    files:
      _vale: |
        StylesPath = ../../styles/
        MinAlertLevel = warning

        [*]
        BasedOnStyles = vale
        write-good.ThereIs = YES
        demo.Spelling = YES
    args: test.py
    exit: 1
    want: |
      test.py:1:3:write-good.ThereIs:Don't start a sentence with 'There is'
      test.py:1:37:vale.Editorializing:Consider removing 'Very'
      test.py:2:55:demo.Spelling:Inconsistent spelling of 'center'

  - name: glob-section
    files:
      _vale: |
        StylesPath = ../../styles/
        MinAlertLevel = warning

        [*.{md,py}]
        BasedOnStyles = vale

        write-good.ThereIs = YES
        vale.Spelling = NO
    args: test.py
    exit: 1
    want: |
      test.py:1:3:write-good.ThereIs:Don't start a sentence with 'There is'
      test.py:1:37:vale.Editorializing:Consider removing 'Very'

  - name: builtin-rule-level
    files:
      .vale: |
        StylesPath = ../../styles/
        MinAlertLevel = error

        [*]
        vale.Editorializing = error
    args: test.md
    exit: 1
    want: |
      test.md:1:11:vale.Editorializing:Consider removing 'very'

  - name: external-rule-level
    files:
      _vale: |
        StylesPath = ../../styles/
        MinAlertLevel = error

        [*.{md,py}]
        write-good.Weasel = error
    args: test.py
    exit: 1
    want: |
      test.py:1:37:write-good.Weasel:'Very' is a weasel word!

  - name: level-override-suggestion
    files:
      _vale: |
        StylesPath = ../../styles/
        MinAlertLevel = warning

        [*]
        BasedOnStyles = write-good
    args: "--minAlertLevel=suggestion test.md"
    exit: 0
    want: |
      test.md:1:6:write-good.E-Prime:Avoid using "is"
      test.md:1:11:write-good.Weasel:'very' is a weasel word!
      test.md:1:42:write-good.E-Prime:Avoid using "is"

  - name: level-override-error
    files:
      _vale: |
        StylesPath = ../../styles/
        MinAlertLevel = warning

        [*]
        BasedOnStyles = write-good
    args: "--minAlertLevel=error test.md"
    exit: 0
    want: ""

  - name: level-override-none
    files:
      _vale: |
        StylesPath = ../../styles/
        MinAlertLevel = warning

        [*]
        BasedOnStyles = write-good
    args: test.md
    exit: 0
    want: |
      test.md:1:11:write-good.Weasel:'very' is a weasel word!

  - name: level-per-syntax
    about: "#965 -- a level set under one section belongs to that section. It
      used to be collected globally, so the last section in the file decided
      the level for every format. Here Markdown is downgraded below
      MinAlertLevel and drops out; HTML, sharing the style, does not."
    files:
      test.html: |
        <p>This is a very important sentence.</p>
      _vale: |
        StylesPath = ../../styles/
        MinAlertLevel = warning

        [*.{html,md}]
        BasedOnStyles = write-good

        [*.md]
        write-good.Weasel = suggestion
    args: .
    exit: 0
    want: |
      test.html:1:14:write-good.Weasel:'very' is a weasel word!

  - name: level-per-syntax-raised
    about: "#965 -- and the other direction: Markdown alone is raised to meet
      MinAlertLevel, so it reports where HTML stays quiet."
    files:
      test.html: |
        <p>This is a very important sentence.</p>
      _vale: |
        StylesPath = ../../styles/
        MinAlertLevel = error

        [*.{html,md}]
        BasedOnStyles = write-good

        [*.md]
        write-good.Weasel = error
    args: .
    exit: 1
    want: |
      test.md:1:11:write-good.Weasel:'very' is a weasel word!

  - name: based-on-styles-empty-resets
    about: an empty BasedOnStyles clears the rule settings a file inherited, not only its styles
    files:
      _vale: |
        StylesPath = ../../styles/
        MinAlertLevel = warning

        [*]
        BasedOnStyles = write-good
        write-good.Weasel = warning

        [*.py]
        BasedOnStyles =
    args: test.py test.md
    exit: 0
    want: |
      test.md:1:11:write-good.Weasel:'very' is a weasel word!

  - name: based-on-styles-empty-then-rule
    about: a rule named after the empty BasedOnStyles still runs
    files:
      _vale: |
        StylesPath = ../../styles/
        MinAlertLevel = warning

        [*]
        BasedOnStyles = write-good

        [*.py]
        BasedOnStyles =
        write-good.Weasel = YES
    args: test.py
    exit: 0
    want: |
      test.py:1:37:write-good.Weasel:'Very' is a weasel word!

  - name: rule-unset
    about: UNSET drops an inherited setting, so the rule follows BasedOnStyles again
    files:
      _vale: |
        StylesPath = ../../styles/
        MinAlertLevel = warning

        [*]
        write-good.Weasel = YES

        [*.py]
        write-good.Weasel = UNSET
    args: test.py test.md
    exit: 0
    want: |
      test.md:1:11:write-good.Weasel:'very' is a weasel word!

  - name: style-unset
    about: UNSET on a style name drops what an earlier section said about the whole style
    files:
      _vale: |
        StylesPath = ../../styles/
        MinAlertLevel = warning

        [*]
        BasedOnStyles = write-good

        [*.md]
        write-good = NO

        [*.md]
        write-good = UNSET
    args: test.md
    exit: 0
    want: |
      test.md:1:11:write-good.Weasel:'very' is a weasel word!

  - name: style-unset-keeps-rule-setting
    about: UNSET on a style leaves a rule-level global setting in place
    files:
      _vale: |
        StylesPath = ../../styles/
        MinAlertLevel = warning

        [*]
        BasedOnStyles = write-good
        write-good.Weasel = NO

        [*.md]
        write-good = NO

        [*.md]
        write-good = UNSET
    args: test.md
    exit: 0
    want: ""

  - name: styles-path-not-walked
    about: a StylesPath holds rules and vocabularies, not prose, so a walk
      skips it; naming a file inside it still lints that file
    files:
      _vale: |
        StylesPath = styles
        MinAlertLevel = suggestion

        [*]
        BasedOnStyles = Vale
      styles/Demo/README.md: |
        This is a readme with a typpo.
      docs/page.md: |
        This page has a typpo.
    args: .
    exit: 1
    want: |
      docs/page.md:1:17:Vale.Spelling:Did you really mean 'typpo'?
      test.md:1:66:Vale.Spelling:Use 'JavaScript' instead of 'javascript'.
      test.md:1:77:Vale.Spelling:Did you really mean 'agendize'?

  - name: styles-path-named
    about: the same project, with the file inside the StylesPath named
    files:
      _vale: |
        StylesPath = styles
        MinAlertLevel = suggestion

        [*]
        BasedOnStyles = Vale
      styles/Demo/README.md: |
        This is a readme with a typpo.
    args: styles/Demo/README.md
    exit: 1
    want: |
      styles/Demo/README.md:1:11:Vale.Spelling:Use 'README' instead of 'readme'.
      styles/Demo/README.md:1:25:Vale.Spelling:Did you really mean 'typpo'?

  - name: rule-file-prose-only
    about: a Vale rule named on the command line is linted by its message and
      description; its tokens, swaps, and exceptions are patterns, not prose
    files:
      _vale: |
        StylesPath = styles
        MinAlertLevel = suggestion

        [*]
        BasedOnStyles = Vale
      styles/Demo/Rule.yml: |
        extends: substitution
        message: "Prefer %s over %s, plaese."
        description: |
          A typpo here, and
          another typpo there.
        link: https://example.com/optimi[sz]e
        level: warning
        swap:
          teh quick: the quick
        exceptions:
          - teh brown
        tokens:
          - teh lazy dog
          - skillz
    args: styles/Demo
    exit: 1
    want: |
      styles/Demo/Rule.yml:2:30:Vale.Spelling:Did you really mean 'plaese'?
      styles/Demo/Rule.yml:4:5:Vale.Spelling:Did you really mean 'typpo'?
      styles/Demo/Rule.yml:5:11:Vale.Spelling:Did you really mean 'typpo'?

  - name: vocab-per-section
    about: a section's Vocab adds its terms for that section's files only, with
      Terms and Avoid rules of its own; the top-level Vocab is unchanged
    files:
      _vale: |
        StylesPath = styles
        MinAlertLevel = suggestion
        Vocab = Base

        [*]
        BasedOnStyles = Vale

        [api/*.md]
        Vocab = API
      styles/config/vocabularies/Base/accept.txt: |
        Zorbblat
      styles/config/vocabularies/API/accept.txt: |
        Quxelate
        kubeadm
      styles/config/vocabularies/API/reject.txt: |
        k8s
      api/page.md: |
        Run kubeadm on Zorbblat with Quxelate, not quxelate or k8s.
      docs/page.md: |
        Run kubeadm on Zorbblat with Quxelate, not quxelate or k8s.
    args: api/page.md docs/page.md
    exit: 1
    want: |
      api/page.md:1:44:Vale.API.Terms:Use 'Quxelate' instead of 'quxelate'.
      api/page.md:1:44:Vale.Spelling:Did you really mean 'quxelate'?
      api/page.md:1:56:Vale.API.Avoid:Avoid using 'k8s'.
      docs/page.md:1:5:Vale.Spelling:Did you really mean 'kubeadm'?
      docs/page.md:1:30:Vale.Spelling:Did you really mean 'Quxelate'?
      docs/page.md:1:44:Vale.Spelling:Did you really mean 'quxelate'?

  - name: unreadable-document-continues
    about: a document that can't be parsed is reported, the rest are still
      linted, and the run exits as an error; it used to stop the run at the
      first such file
    files:
      _vale: |
        MinAlertLevel = suggestion

        [*.{md,mdx}]
        BasedOnStyles = Vale
      a-broken.md: |
        ---
        title: [unclosed
        ---

        Text.
      b-tag.mdx: |
        # Title

        <Card title={

        This is never read.
      c-expr.mdx: |
        ---
        title: Front matter
        description: "Two lines
          long"
        ---

        # Title

        {1 +

        This is never read.
      d-good.md: |
        This is a speling mistake.
    args: .
    exit: 2
    want: |
      d-good.md:1:11:Vale.Spelling:Did you really mean 'speling'?
      test.md:1:66:Vale.Spelling:Use 'JavaScript' instead of 'javascript'.
      test.md:1:77:Vale.Spelling:Did you really mean 'agendize'?
      a-broken.md:1:E201:yaml: line 1: did not find expected ',' or ']'
      b-tag.mdx:3:E201:Invalid MDX: the tag opened here never ends, so the rest of the file can't be read.
      c-expr.mdx:9:E201:Invalid MDX: the expression opened here never closes, so the rest of the file can't be read.

  - name: package-styles-dropped
    about: a project's section that replaces the styles a package turns on, and
      leaves some out, says so once, naming what to list
    files:
      _vale: |
        StylesPath = styles

        [docs/**]
        BasedOnStyles = Extra
      styles/.vale-config/1-House.ini: |
        [*.md]
        BasedOnStyles = House
      styles/House/Simply.yml: |
        extends: existence
        message: "Avoid '%s'."
        level: error
        tokens: [simply]
      styles/Extra/Basically.yml: |
        extends: existence
        message: "Avoid '%s'."
        level: error
        tokens: [basically]
      top.md: |
        This is simply and basically fine.
      docs/a.md: |
        This is simply and basically fine.
      docs/b.md: |
        This is simply and basically fine.
    args: top.md docs/a.md docs/b.md
    exit: 1
    want: |
      W101 [docs/**] replaces the styles the House package turns on for its files (House). To keep them, list them too: BasedOnStyles = House, Extra
      docs/a.md:1:20:Extra.Basically:Avoid 'basically'.
      docs/b.md:1:20:Extra.Basically:Avoid 'basically'.
      top.md:1:9:House.Simply:Avoid 'simply'.

  - name: vocab-star-section
    about: "`Vocab` in `[*]` beside a top-level `Vocab` names a vocabulary for
      every file, with rules of its own; it used to be read as a misplaced
      core option"
    files:
      _vale: |
        StylesPath = styles
        MinAlertLevel = suggestion
        Vocab = Base

        [*]
        BasedOnStyles = Vale
        Vocab = Pkg
      styles/config/vocabularies/Base/accept.txt: |
        Quxelate
      styles/config/vocabularies/Pkg/accept.txt: |
        Zorbblat
      page.md: |
        Zorbblat and Quxelate, then zorbblat and quxelate.
    args: page.md
    exit: 1
    want: |
      page.md:1:29:Vale.Pkg.Terms:Use 'Zorbblat' instead of 'zorbblat'.
      page.md:1:29:Vale.Spelling:Did you really mean 'zorbblat'?
      page.md:1:42:Vale.Terms:Use 'Quxelate' instead of 'quxelate'.

  - name: vocab-from-a-package
    about: a package's `[*]` vocabulary adds to the project's, and the project
      can switch off its rules by name, or clear it with `Vocab = NONE`
    files:
      _vale: |
        StylesPath = styles
        MinAlertLevel = suggestion
        Vocab = Base

        [*]
        BasedOnStyles = Vale
        Vale.Pkg.Terms = NO
      styles/.vale-config/1-Pkg.ini: |
        [*]
        Vocab = Pkg
      styles/config/vocabularies/Base/accept.txt: |
        Quxelate
      styles/config/vocabularies/Pkg/accept.txt: |
        Zorbblat
      page.md: |
        Zorbblat and Quxelate, then zorbblat and quxelate.
    args: page.md
    exit: 1
    want: |
      page.md:1:29:Vale.Spelling:Did you really mean 'zorbblat'?
      page.md:1:42:Vale.Terms:Use 'Quxelate' instead of 'quxelate'.

  - name: vocab-none
    about: "`Vocab = NONE` clears the vocabularies earlier layers named at the
      same level: in `[*]` the package's, at the top the project's own"
    files:
      _vale: |
        StylesPath = styles
        MinAlertLevel = suggestion
        Vocab = NONE

        [*]
        BasedOnStyles = Vale
        Vocab = NONE
      styles/.vale-config/1-Pkg.ini: |
        Vocab = Base

        [*]
        Vocab = Pkg
      styles/config/vocabularies/Base/accept.txt: |
        Quxelate
      styles/config/vocabularies/Pkg/accept.txt: |
        Zorbblat
      page.md: |
        Zorbblat and Quxelate.
    args: page.md
    exit: 1
    want: |
      page.md:1:1:Vale.Spelling:Did you really mean 'Zorbblat'?
      page.md:1:14:Vale.Spelling:Did you really mean 'Quxelate'?

  - name: vocab-yaml
    about: "#1089 -- a vocab.yml beside accept.txt: a term is literal and
      enforces its case; `flags` expands Hunspell affix flags; `ignorecase`
      accepts any case without a Terms alert; and `regex` makes the term a
      pattern"
    files:
      _vale: |
        StylesPath = styles
        MinAlertLevel = suggestion
        Vocab = Proj

        [*]
        BasedOnStyles = Vale
      styles/config/vocabularies/Proj/accept.txt: |
        Zorbblat
      styles/config/vocabularies/Proj/vocab.yml: |
        accept:
          - Grix.io            # literal: the period is not a wildcard
          - quxelate: {flags: S}
          - flimbo:
              ignorecase: true
          - '[Bb]rizzle': {regex: true}
        reject:
          - k8s
          - frobnar: {ignorecase: true}
      page.md: |
        Zorbblat and Grix.io ran two quxelates, then Flimbo and Brizzle.
        Grixaio, grix.io, zorbblat, k8s, and FROBNAR are wrong.
    args: page.md
    exit: 1
    want: |
      page.md:2:1:Vale.Spelling:Did you really mean 'Grixaio'?
      page.md:2:10:Vale.Terms:Use 'Grix.io' instead of 'grix.io'.
      page.md:2:19:Vale.Terms:Use 'Zorbblat' instead of 'zorbblat'.
      page.md:2:29:Vale.Avoid:Avoid using 'k8s'.
      page.md:2:38:Vale.Avoid:Avoid using 'FROBNAR'.

  - name: vocab-terms-punctuation
    about: a term that starts or ends with punctuation is found by Terms,
      which `\b` couldn't do beside a space, and not inside a longer word
    files:
      _vale: |
        StylesPath = styles
        MinAlertLevel = suggestion
        Vocab = Proj

        [*]
        BasedOnStyles = Vale
        Vale.Spelling = NO
      styles/config/vocabularies/Proj/accept.txt: |
        .NET
        C#
      styles/config/vocabularies/Proj/vocab.yml: |
        accept:
          - C++
