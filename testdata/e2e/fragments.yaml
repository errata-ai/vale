  - name: comment-columns
    about: "#1206 -- an alert in a comment is placed by what extraction took
      off the front of its line, recorded as it was taken: the opener, the
      indentation, a line comment's own space. Rebuilding the opener's width
      afterwards put `/**` alerts two columns early."
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion

        [*]
        T.Z = YES
      styles/T/Z.yml: |
        extends: existence
        message: "'%s'"
        level: error
        tokens:
          - ZEBRA
      test.js: |
        /** one ZEBRA here */
            /** two ZEBRA here */
        /** three ZEBRA
         * four ZEBRA
         */
        x();
            // five ZEBRA
            //   six ZEBRA
        y();
      test.ts: |
        /** one ZEBRA here */
            /** two ZEBRA here */
        /** three ZEBRA
         */
        x();
      test.py: |
        def f():
            """One ZEBRA here.

            Two ZEBRA here.
            """
            x = 1  # three ZEBRA
    args: test.js test.ts test.py
    exit: 1
    want: |
      test.js:1:9:T.Z:'ZEBRA'
      test.js:2:13:T.Z:'ZEBRA'
      test.js:3:11:T.Z:'ZEBRA'
      test.js:4:9:T.Z:'ZEBRA'
      test.js:7:13:T.Z:'ZEBRA'
      test.js:8:14:T.Z:'ZEBRA'
      test.py:2:12:T.Z:'ZEBRA'
      test.py:4:9:T.Z:'ZEBRA'
      test.py:6:20:T.Z:'ZEBRA'
      test.ts:1:9:T.Z:'ZEBRA'
      test.ts:2:13:T.Z:'ZEBRA'
      test.ts:3:11:T.Z:'ZEBRA'

  - name: blank-comment-line
    about: |
      #1022: a blank line comment produced two lines in the extracted text
      where the source has one, so every alert below it was reported a line
      too far down with its column collapsed to 1.
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion

        [*.{proto,go}]
        BasedOnStyles = T
      styles/T/Eror.yml: |
        extends: existence
        message: "Found '%s'."
        level: error
        tokens:
          - Eror
      test.proto: |
        syntax = "proto3";

        // Correct.
        // Correct.
        // Eror.
        //
        // Eror.
        message Message {}
      test.go: |
        package main

        // Eror.
        //
        //
        // Eror.
        func main() {}
    args: .
    exit: 1
    want: |
      test.go:3:4:T.Eror:Found 'Eror'.
      test.go:6:4:T.Eror:Found 'Eror'.
      test.proto:5:4:T.Eror:Found 'Eror'.
      test.proto:7:4:T.Eror:Found 'Eror'.

  - name: doc-mask-partial-match
    about: "#1207 -- a doc comment's masks drop an alert whose match lies
      inside them, like one on the symbol a `{@link}` names; a match that
      only starts in a mask and runs on into the prose is kept"
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion

        [*.ts]
        BasedOnStyles = T
      styles/T/Phrase.yml: |
        extends: existence
        message: "Found '%s'."
        level: error
        nonword: true
        tokens:
          - '\{@link Foo\} runs on'
      styles/T/Symbol.yml: |
        extends: existence
        message: "Found '%s'."
        level: error
        tokens:
          - Foo
      styles/T/Tag.yml: |
        extends: existence
        message: "Found '%s'."
        level: error
        nonword: true
        tokens:
          - '@link'
      test.ts: |
        /**
         * See {@link Foo} runs on every call. Foo again.
         */
        export function f() {}
    args: test.ts
    exit: 1
    want: |
      test.ts:2:8:T.Phrase:Found '{@link Foo} runs on'.
      test.ts:2:40:T.Symbol:Found 'Foo'.

  - name: tab-indented-block
    about: |
      #1130: only spaces were stripped when dedenting a block comment, so one
      indented with tabs stayed indented and Markdown read its body as a code
      block.
    files:
      .vale.ini: |
        StylesPath = ../../styles/
        MinAlertLevel = suggestion

        [formats]
        ts = md

        [*.ts]
        BasedOnStyles = Vale
      test.ts: |
        /**
         * Top-level. Reads a Recrod.
         */
        function x() {}

        interface A {
        	/**
        	 * Indented with tabs. Reads a Recrod.
        	 */
        	x: () => {}
        }

        interface B {
            /**
             * Indented with spaces. Reads a Recrod.
             */
            x: () => {}
        }
    args: test.ts
    exit: 1
    want: |
      test.ts:2:23:Vale.Spelling:Did you really mean 'Recrod'?
      test.ts:8:33:Vale.Spelling:Did you really mean 'Recrod'?
      test.ts:15:38:Vale.Spelling:Did you really mean 'Recrod'?
