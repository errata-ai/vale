# Custom views.
name: views
dir: fixtures/views

cases:
  - name: tsx
    about: "#1216 -- a `.tsx` file is read with the TSX grammar, so a View can
      query JSX; it was parsed as TypeScript, which has no `jsx_text` node"
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion

        [*.tsx]
        BasedOnStyles = Vale
        View = Screens
      styles/config/views/Screens.yml: |
        engine: tree-sitter
        scopes:
          - name: screen
            expr: (jsx_text) @prose
      page.tsx: |
        export const Page = () => <h1>Texts started agian</h1>;
    args: page.tsx
    exit: 1
    want: |
      page.tsx:1:45:Vale.Spelling:Did you really mean 'agian'?

  - name: yaml
    args: .
    exit: 1
    want: |
      API.yml:3:10:Scopes.Titles:'sample API' should be capitalized
      API.yml:9:70:Vale.Spelling:Did you really mean 'serrver'?
      API.yml:13:24:Vale.Spelling:Did you really mean 'serrver'?
      API.yml:15:70:Vale.Spelling:Did you really mean 'serrver'?
      API.yml:20:48:Vale.Spelling:Did you really mean 'servver'?
      COMMIT_EDITMSG:1:55:Scopes.Subject:A subject line doesn't end with '.'.
      COMMIT_EDITMSG:3:23:Vale.Spelling:Did you really mean 'occurence'?
      COMMIT_EDITMSG:6:1:Scopes.Trailer:'Signed-off-by:' isn't a trailer Vale knows.
      Petstore.yaml:15:18:Vale.Spelling:Did you really mean 'Petstore'?
      Petstore.yaml:29:28:Vale.Spelling:Did you really mean 'Petstore'?
      Petstore.yaml:407:17:Vale.Spelling:Did you really mean 'nonintegers'?
      Rule.yml:3:39:Vale.Repetition:'can' is repeated!
      ansible.yml:3:13:Scopes.Titles:'reusing Code with Ansible Roles and Coent Collections' should be capitalized
      ansible.yml:3:49:Vale.Spelling:Did you really mean 'Coent'?
      ansible.yml:5:60:Vale.Spelling:Did you really mean 'devlop'?
      ansible.yml:13:28:Vale.Spelling:Did you really mean 'purose'?
      github-workflow.json:18:53:Vale.Spelling:'pull_request' looks like code; format it as code.
      github-workflow.json:228:256:Vale.Spelling:Did you really mean 'env'?
      github-workflow.json:356:53:Vale.Spelling:'pull_request' looks like code; format it as code.
      github-workflow.json:497:213:Vale.Spelling:Did you really mean 'INPUT_'?
      github-workflow.json:543:293:Vale.Spelling:Did you really mean 'prereleased'?
      github-workflow.json:617:89:Vale.Spelling:'job_id' looks like code; format it as code.
      github-workflow.json:717:89:Vale.Spelling:'job_id' looks like code; format it as code.
      github-workflow.json:902:164:Vale.Spelling:Did you really mean 'redis'?
      issue1018.yml:3:26:Vale.Spelling:Did you really mean 'misspeling'?
      issue1018.yml:7:9:Vale.Spelling:Did you really mean 'misspeled'?
      test.java:13:38:vale.Annotations:'XXX' left in text
      test.py:1:3:vale.Annotations:'FIXME' left in text
      test.py:11:3:vale.Annotations:'XXX' left in text
      test.py:13:16:vale.Annotations:'XXX' left in text
      test.py:14:14:vale.Annotations:'NOTE' left in text
      transcript.txt:3:6:Scopes.Assistant:'worth noting' hedges, and this is the model's turn.
      transcript.txt:3:42:Vale.Spelling:Did you really mean 'occurence'?

  - name: yaml-comments
    about: "#1188 -- a tree-sitter View on a YAML file reads its comments and
      nothing else. A YAML file is data, and was handed to the dasel engine
      whatever the View's engine said, which failed on the query."
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion

        [*.{yml,yaml}]
        BasedOnStyles = T
        View = Comments
      styles/config/views/Comments.yml: |
        engine: tree-sitter
        scopes:
          - expr: (comment)+ @comment
      styles/T/Todo.yml: |
        extends: existence
        message: "found %s"
        level: warning
        tokens:
          - TODO
      values.yaml: |
        # Default values for demo.
        # TODO: top-of-file comment

        replicaCount: 1 # TODO: trailing comment

        image:
          # -- TODO: a helm-docs style description
          repository: nginx
          tag: "TODO-not-a-comment"
      Chart.yml: |
        apiVersion: v2
        # TODO: chart-level comment
        name: demo
        description: A TODO in a value, not a comment
    args: --output=line Chart.yml values.yaml
    exit: 0
    want: |
      Chart.yml:2:3:T.Todo:found TODO
      values.yaml:2:3:T.Todo:found TODO
      values.yaml:4:19:T.Todo:found TODO
      values.yaml:7:8:T.Todo:found TODO

  - name: text
    about: "a `textfsm` view reads plain text through a template and names
      what it captures. The commit message yields a subject, a body, and
      trailers, each placed on its own line and column; the transcript
      exposes only the model's turns, so the misspelling in the user's
      prompt goes unreported."
    args: COMMIT_EDITMSG transcript.txt
    exit: 1
    want: |
      COMMIT_EDITMSG:1:55:Scopes.Subject:A subject line doesn't end with '.'.
      COMMIT_EDITMSG:3:23:Vale.Spelling:Did you really mean 'occurence'?
      COMMIT_EDITMSG:6:1:Scopes.Trailer:'Signed-off-by:' isn't a trailer Vale knows.
      transcript.txt:3:6:Scopes.Assistant:'worth noting' hedges, and this is the model's turn.
      transcript.txt:3:42:Vale.Spelling:Did you really mean 'occurence'?
    absent:
      - enuf

  - name: selector-error
    about: "a selector that fails is reported against the file it was applied
      to, with the cause from both dasel dialects"
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion

        [*.yml]
        BasedOnStyles = Chat
        View = Chat
      styles/Chat/Hedge.yml: |
        extends: existence
        message: "'%s' hedges"
        level: error
        scope: assistant
        tokens:
          - worth noting
      styles/config/views/Chat.yml: |
        engine: dasel
        scopes:
          - name: assistant
            expr: 'messages.filter(role == "assistant").content'
      chat.yml: |
        messages:
          - role: user
            content: It is worth noting that I asked.
          - role: assistant
            content: It is worth noting that I answered.
    args: chat.yml
    exit: 2
    contains: |
      chat.yml: processing scope "assistant": unexpected type: expected map, got array (as a v2 selector: cannot use property selector on non map/struct types: slice: property not found: role == "assistant")

  - name: selector-filter
    about: "a filter selects only what it says"
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion

        [*.yml]
        BasedOnStyles = Chat
        View = Chat
      styles/Chat/Hedge.yml: |
        extends: existence
        message: "'%s' hedges"
        level: error
        scope: assistant
        tokens:
          - worth noting
      styles/config/views/Chat.yml: |
        engine: dasel
        scopes:
          - name: assistant
            expr: messages.all().filter(equal(role,assistant)).content
      chat.yml: |
        messages:
          - role: user
            content: It is worth noting that I asked.
          - role: assistant
            content: It is worth noting that I answered.
    args: chat.yml
    exit: 1
    want: |
      chat.yml:5:20:Chat.Hedge:'worth noting' hedges

  - name: presence
    about: "a value the template never fills is an empty scope at the top of
      the file, so `occurrence` with `min` reports what is missing and every
      other rule stays quiet; a Markdown-typed scope is included"
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion

        [*.txt]
        BasedOnStyles = Need
        View = Commit
      styles/config/views/Commit.yml: |
        engine: textfsm
        template: |
          Value Subject (.+)
          Value List Body (.*)
          Value List Trailer ((?:BREAKING CHANGE|[A-Z][\w-]+): .+)

          Start
            ^${Subject} -> Body

          Body
            ^# -> Next
            ^${Trailer}
            ^${Body}
        scopes:
          - name: subject
            expr: Subject
          - name: body
            expr: Body
            type: md
          - name: trailer
            expr: Trailer
      styles/Need/SignedOff.yml: |
        extends: occurrence
        message: "A commit needs a Signed-off-by trailer."
        level: error
        scope: trailer
        min: 1
        token: '^Signed-off-by: '
      styles/Need/Body.yml: |
        extends: occurrence
        message: "A commit needs a body."
        level: warning
        scope: body
        min: 1
        token: '\S'
      styles/Need/Hedge.yml: |
        extends: existence
        message: "'%s' hedges"
        level: suggestion
        scope: body
        tokens:
          - worth noting
      subject-only.txt: |
        fix: a thing
      no-body.txt: |
        fix: a thing

        Signed-off-by: J <j@example.com>
      complete.txt: |
        fix: a thing

        It is worth noting.

        Signed-off-by: J <j@example.com>
    args: subject-only.txt no-body.txt complete.txt
    exit: 1
    want: |
      complete.txt:3:7:Need.Hedge:'worth noting' hedges
      no-body.txt:1:1:Need.Body:A commit needs a body.
      subject-only.txt:1:1:Need.Body:A commit needs a body.
      subject-only.txt:1:1:Need.SignedOff:A commit needs a Signed-off-by trailer.

  - name: any-extension
    about: "a dasel View applies to whatever file its section matches; a
      `.log` holding JSON was linted whole, and its selector never ran"
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion

        [*.log]
        BasedOnStyles = Chat
        View = Chat
      styles/Chat/Hedge.yml: |
        extends: existence
        message: "'%s' hedges"
        level: error
        tokens:
          - worth noting
      styles/config/views/Chat.yml: |
        engine: dasel
        scopes:
          - name: assistant
            expr: all().filter(equal(role,assistant)).content
      chat.log: |
        [{"role":"user","content":"It is worth noting that I asked."},{"role":"assistant","content":"It is worth noting that I answered."}]
    args: chat.log
    exit: 1
    want: |
      chat.log:1:100:Chat.Hedge:'worth noting' hedges

  - name: any-extension-error
    about: "and a selector that fails on such a file is reported, not skipped"
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion

        [*.log]
        BasedOnStyles = Chat
        View = Chat
      styles/Chat/Hedge.yml: |
        extends: existence
        message: "'%s' hedges"
        level: error
        tokens:
          - worth noting
      styles/config/views/Chat.yml: |
        engine: dasel
        scopes:
          - name: assistant
            expr: this.is.not.valid.[[[
      chat.log: |
        [{"role":"user","content":"It is worth noting that I asked."}]
    args: chat.log
    exit: 2
    contains: |
      chat.log: processing scope "assistant": unexpected type: expected map, got array

  - name: across-values
    about: "a fact about a line is a value for that line, and a `conditional`
      with `in` looks for its consequent in another of the View's scopes"
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion

        [*.txt]
        BasedOnStyles = Conv
        View = Commit
      styles/config/views/Commit.yml: |
        engine: textfsm
        template: |
          Value Subject (.+)
          Value Gap (.*)
          Value List Body (.*)
          Value List Trailer ((?:BREAKING CHANGE|[A-Z][\w-]+): .+)

          Start
            ^${Subject} -> Gap

          Gap
            ^${Gap} -> Body

          Body
            ^# -> Next
            ^${Trailer}
            ^${Body}
        scopes:
          - name: subject
            expr: Subject
          - name: gap
            expr: Gap
          - name: body
            expr: Body
          - name: trailer
            expr: Trailer
      styles/Conv/LeadingBlank.yml: |
        extends: existence
        message: "The body must be separated from the subject by a blank line."
        level: error
        scope: gap
        nonword: true
        raw:
          - '\A\S'
      styles/Conv/BreakingFooter.yml: |
        extends: conditional
        message: "A '!' in the subject needs a 'BREAKING CHANGE:' footer."
        level: error
        scope: subject
        first: '^\w+(?:\([^)]*\))?!:'
        second: '^BREAKING CHANGE: '
        in: trailer
      styles/Conv/BreakingBang.yml: |
        extends: conditional
        message: "A 'BREAKING CHANGE:' footer needs a '!' in the subject."
        level: error
        scope: trailer
        first: '^BREAKING CHANGE: '
        second: '^\w+(?:\([^)]*\))?!:'
        in: subject
      marked.txt: |
        feat!: drop the flag

        The flag is gone.

        BREAKING CHANGE: the flag is gone
      unmarked.txt: |
        feat!: drop the flag

        The flag is gone.
      unflagged.txt: |
        feat: drop the flag

        BREAKING CHANGE: the flag is gone
      crowded.txt: |
        feat: add a thing
        The body starts too soon.
      plain.txt: |
        feat: add a thing
    args: marked.txt unmarked.txt unflagged.txt crowded.txt plain.txt
    exit: 1
    want: |
      crowded.txt:2:1:Conv.LeadingBlank:The body must be separated from the subject by a blank line.
      unflagged.txt:3:1:Conv.BreakingBang:A 'BREAKING CHANGE:' footer needs a '!' in the subject.
      unmarked.txt:1:1:Conv.BreakingFooter:A '!' in the subject needs a 'BREAKING CHANGE:' footer.

  - name: across-values-unknown
    about: "an `in` that no View defines is an error at load"
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion

        [*.txt]
        BasedOnStyles = Conv
        View = Commit
      styles/config/views/Commit.yml: |
        engine: textfsm
        template: |
          Value Subject (.+)

          Start
            ^${Subject}
        scopes:
          - name: subject
            expr: Subject
      styles/Conv/Breaking.yml: |
        extends: conditional
        message: "needs a footer"
        level: error
        scope: subject
        first: '!:'
        second: '^BREAKING CHANGE: '
        in: trailer
      plain.txt: |
        feat: add a thing
    args: plain.txt
    exit: 2
    contains: |
      no View defines a scope named 'trailer'

  - name: typed-code
    about: |
      A tree-sitter scope's `type` names the markup its comments are written
      in: a fenced block in a Rust doc comment is code, and a bracketed
      symbol is a link.
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion

        [*.rs]
        BasedOnStyles = Vale
        Vale.Terms = NO
        Vale.Avoid = NO
        Vale.Repetition = NO
        View = Rust
      styles/config/views/Rust.yml: |
        engine: tree-sitter
        scopes:
          - expr: (line_comment)+ @comment
            type: md
      lib.rs: |
        /// Reads the recrd and returns it.
        ///
        /// ```
        /// let vaule = read(ctx);
        /// ```
        ///
        /// See [`Reader`] and [Writr] for the detials.
        pub fn read() {}
    args: lib.rs
    exit: 1
    want: |
      lib.rs:1:15:Vale.Spelling:Did you really mean 'recrd'?
      lib.rs:7:40:Vale.Spelling:Did you really mean 'detials'?

  - name: data-comments
    about: |
      A data file's comments are prose whatever its View selects, and a `#`
      inside a string is not a comment.
    files:
      .vale.ini: |
        StylesPath = styles
        MinAlertLevel = suggestion

        [*.{yml,toml}]
        BasedOnStyles = Vale
        Vale.Terms = NO
        Vale.Avoid = NO
        Vale.Repetition = NO
        View = Data
      styles/config/views/Data.yml: |
        engine: dasel
        scopes:
          - name: title
            expr: title
      site.yml: |
        # The defalt settings.
        title: A guide to the storag layer
        slug: "not # a commnt"  # A trailng one.
      site.toml: |
        # The defalt settings.
        title = "A guide to the storag layer"
        slug = "not # a commnt" # A trailng one.
    args: site.yml site.toml
    exit: 1
    want: |
      site.toml:1:7:Vale.Spelling:Did you really mean 'defalt'?
      site.toml:2:25:Vale.Spelling:Did you really mean 'storag'?
      site.toml:3:29:Vale.Spelling:Did you really mean 'trailng'?
      site.yml:1:7:Vale.Spelling:Did you really mean 'defalt'?
      site.yml:2:23:Vale.Spelling:Did you really mean 'storag'?
      site.yml:3:29:Vale.Spelling:Did you really mean 'trailng'?
